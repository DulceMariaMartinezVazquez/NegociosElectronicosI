<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos — Panel de administrador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Diseño específico de esta página (no se tocó styles.css) -->
<style>
  body{
    background: var(--purple-bg);
  }

  .admin-shell{
    display:flex;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .admin-sidebar{
    width: 240px;
    flex-shrink: 0;
    background: #201B33;
    color: #fff;
    display:flex;
    flex-direction: column;
    padding: 26px 18px;
  }

  .admin-brand{
    display:flex;
    align-items:center;
    gap: 10px;
    padding: 0 8px 24px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .admin-brand img{
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
  }

  .admin-brand .name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.2;
  }

  .admin-brand .tag{
    font-size: 11px;
    color: #B7AEDE;
  }

  .admin-nav{
    display:flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .admin-nav a{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 12px;
    color: #C9C2E8;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s, color .2s;
  }

  .admin-nav a svg{
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .admin-nav a:hover{
    background: rgba(255,255,255,0.06);
    color: #fff;
  }

  .admin-nav a.active{
    background: var(--purple);
    color: #fff;
  }

  .admin-nav .nav-label{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: #7E75A8;
    margin: 18px 12px 6px;
  }

  .admin-sidebar-footer{
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 14px;
    margin-top: 14px;
  }

  .admin-sidebar-footer a{
    display:flex;
    align-items:center;
    gap: 10px;
    color: #C9C2E8;
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 12px;
    transition: background .2s, color .2s;
  }

  .admin-sidebar-footer a:hover{
    background: rgba(255,255,255,0.06);
    color: #fff;
  }

  .admin-sidebar-footer svg{
    width: 16px;
    height: 16px;
  }

  /* ---------- Main ---------- */
  .admin-main{
    flex: 1;
    min-width: 0;
    padding: 34px 40px 60px;
  }

  .admin-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .admin-topbar h1{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
  }

  .admin-topbar p{
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .btn-add{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    background: var(--purple);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(122,106,216,0.3);
    transition: background .2s, transform .2s;
  }

  .btn-add:hover{
    background: var(--purple-dark);
    transform: translateY(-1px);
  }

  .btn-add svg{
    width: 16px;
    height: 16px;
  }

  /* Table panel */
  .admin-panel{
    background: var(--bg);
    border-radius: 20px;
    padding: 26px;
    box-shadow: 0 10px 24px rgba(122,106,216,0.10);
  }

  .admin-table{
    width: 100%;
    border-collapse: collapse;
  }

  .admin-table th{
    text-align:left;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0 10px 12px;
    border-bottom: 1px solid var(--purple-light);
  }

  .admin-table td{
    padding: 12px 10px;
    font-size: 13.5px;
    color: var(--ink);
    border-bottom: 1px solid var(--purple-bg);
    vertical-align: middle;
  }

  .prod-thumb{
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--purple-light) 0%, #F7F4FD 100%);
    overflow: hidden;
    flex-shrink: 0;
  }

  .prod-thumb img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .prod-name-cell{
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .prod-name-cell .prod-name{
    font-weight: 600;
  }

  .prod-line-tag{
    display:inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--purple-dark);
    background: var(--purple-light);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .status-tag{
    display:inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 11px;
    border-radius: 999px;
  }

  .status-tag.nuevo{ background: #E8F6EC; color: #2E7D45; }
  .status-tag.oferta{ background: #FBE6ED; color: #C0416A; }
  .status-tag.ninguno{ background: var(--purple-bg); color: var(--ink-soft); }

  .row-actions{
    display:flex;
    gap: 8px;
  }

  .row-actions button{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    transition: background .2s;
  }

  .row-actions button svg{
    width: 13px;
    height: 13px;
  }

  .btn-edit{
    background: var(--purple-light);
    color: var(--purple-dark);
  }

  .btn-edit:hover{
    background: var(--purple);
    color: #fff;
  }

  .btn-delete{
    background: #FBEAEA;
    color: #C0392B;
  }

  .btn-delete:hover{
    background: #F3CFCF;
  }

  .table-empty{
    text-align:center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(27,23,48,0.5);
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.show{
    display:flex;
  }

  .modal-box{
    background: var(--bg);
    border-radius: 22px;
    padding: 32px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .modal-box h2{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
    margin-bottom: 22px;
  }

  .modal-box .form-group{
    margin-bottom: 16px;
  }

  .modal-box .form-row{
    display:flex;
    gap: 12px;
  }

  .modal-box .form-row .form-group{
    flex: 1;
  }

  .modal-box select{
    width: 100%;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--purple-bg);
    border: 1px solid var(--purple-light);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .modal-actions{
    display:flex;
    gap: 10px;
    margin-top: 24px;
  }

  .modal-actions .btn-primary{
    flex: 1;
    justify-content:center;
    border: none;
    cursor: pointer;
  }

  .btn-cancel{
    flex: 1;
    background: var(--purple-bg);
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }

  .btn-cancel:hover{
    background: var(--purple-light);
  }

  .toast{
    position: fixed;
    bottom: 26px;
    right: 26px;
    background: #201B33;
    color: #fff;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 500;
    box-shadow: 0 12px 30px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    z-index: 200;
  }

  .toast.show{
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 980px){
    .admin-table{
      display:block;
      overflow-x: auto;
      white-space: nowrap;
    }
  }

  @media (max-width: 760px){
    .admin-shell{
      flex-direction: column;
    }

    .admin-sidebar{
      width: 100%;
      flex-direction: row;
      align-items:center;
      overflow-x: auto;
      padding: 14px 16px;
    }

    .admin-brand{
      border-bottom: none;
      padding: 0 14px 0 0;
      margin-bottom: 0;
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .admin-nav{
      flex-direction: row;
      flex: none;
    }

    .admin-nav .nav-label{
      display:none;
    }

    .admin-sidebar-footer{
      border-top: none;
      border-left: 1px solid rgba(255,255,255,0.1);
      padding-top: 0;
      margin-top: 0;
      padding-left: 10px;
    }

    .admin-main{
      padding: 24px 5%;
    }
  }
</style>
</head>
<body>

<div class="admin-shell">

  <aside class="admin-sidebar">
    <div class="admin-brand">
      <img src="assets/logo.png" alt="Blindbox MX">
      <div>
        <div class="name">Blindbox MX</div>
        <div class="tag">Panel de administrador</div>
      </div>
    </div>

    <nav class="admin-nav">
      <a href="admin.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/>
          <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
        Resumen
      </a>

      <div class="nav-label">Gestión</div>

      <a href="admin-productos.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 7l-8-4-8 4v10l8 4 8-4V7z"/>
          <path d="M4 7l8 4 8-4M12 11v10"/>

      <a href="admin-pedidos.html">

          <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
          <path d="M9 13l2 2 4-4"/>
        </svg>

      </a>

      <a href="admin-promociones.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20.6 12.6L12 21.2 2.8 12A4 4 0 0 1 8.5 6.3L12 9.8l3.5-3.5a4 4 0 0 1 5.7 0 4 4 0 0 1 0 5.7z" transform="scale(0.9) translate(1.2,0.5)"/>
          <path d="M12 3v6M9 6h6"/>

      </a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1>Gestión de productos</h1>
        <p id="productCount">12 productos</p>

    <div class="admin-panel">

<!-- Modal: Agregar / Editar producto -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h2 id="modalTitle">Agregar producto</h2>
    <form id="productForm">
      <input type="hidden" id="f-id">

      <div class="form-group">
        <label for="f-name">Nombre</label>
        <input type="text" id="f-name" placeholder="Ej. Labubu Exciting Macaron" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="f-line">Línea</label>
          <select id="f-line">
            <option>Labubu</option>
            <option>Hirono</option>
            <option>Skullpanda</option>
            <option>Kubo</option>
            <option>Cry Baby</option>
            <option>Nyota</option>
            <option>Dimoo</option>
          </select>
        </div>

        <div class="form-group">
          <label for="f-price">Precio (MXN)</label>
          <input type="number" id="f-price" placeholder="Ej. 350" min="0" required>
        </div>
      </div>

      <div class="form-group">
        <label for="f-image">Imagen (ruta o URL)</label>
        <input type="text" id="f-image" placeholder="images/producto.jpg">
      </div>

      <div class="form-group">
        <label for="f-tag">Etiqueta</label>
        <select id="f-tag">
          <option value="ninguno">Ninguna</option>
          <option value="nuevo">Nuevo</option>
          <option value="oferta">Oferta</option>
        </select>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="btnCancel">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = 'bb_admin_products';

  const seedProducts = [
    { id: 'labubu-1', name: 'Labubu Exciting Macaron', line: 'Labubu', price: 299, image: 'images/L2.png', tag: 'nuevo' },
    { id: 'labubu-2', name: 'Labubu The Monsters', line: 'Labubu', price: 350, image: 'images/L1.png', tag: 'ninguno' },
    { id: 'hirono-1', name: "Hirono Let's Checkmate", line: 'Hirono', price: 300, image: 'images/H1.jpg', tag: 'ninguno' },
    { id: 'hirono-2', name: 'Hirono Sweet Bean', line: 'Hirono', price: 299, image: 'images/H2.jpg', tag: 'oferta' },
    { id: 'skullpanda-1', name: 'Skullpanda Requiem', line: 'Skullpanda', price: 280, image: 'images/S1.png', tag: 'ninguno' },
    { id: 'skullpanda-2', name: 'Skullpanda City of Night', line: 'Skullpanda', price: 340, image: 'images/S2.png', tag: 'nuevo' },
    { id: 'kubo-1', name: 'Kubo Block Society', line: 'Kubo', price: 370, image: 'images/k1_.jpg', tag: 'ninguno' },
    { id: 'kubo-2', name: 'Kubo Ordinary Life', line: 'Kubo', price: 350, image: 'images/k2_.jpg', tag: 'ninguno' },
    { id: 'crybaby-1', name: 'Cry Baby Fashion Ver.', line: 'Cry Baby', price: 400, image: 'images/C1.png', tag: 'ninguno' },
    { id: 'nyota-1', name: 'Nyota Stars Diary', line: 'Nyota', price: 300, image: 'images/n1.png', tag: 'ninguno' },
    { id: 'dimoo-1', name: 'Dimoo Animal Circus', line: 'Dimoo', price: 350, image: 'images/D1.jpg', tag: 'oferta' }
  ];

  function getProducts(){
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (stored && Array.isArray(stored)) return stored;
    } catch (e) {}
    saveProducts(seedProducts);
    return seedProducts.slice();
  }

  function saveProducts(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function showToast(text){
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  function tagLabel(tag){
    if (tag === 'nuevo') return 'Nuevo';
    if (tag === 'oferta') return 'Oferta';
    return 'Ninguna';
  }

  function render(){
    const products = getProducts();
    const tbody = document.getElementById('productTableBody');
    const emptyMsg = document.getElementById('tableEmpty');
    tbody.innerHTML = '';

    document.getElementById('productCount').textContent = products.length + (products.length === 1 ? ' producto' : ' productos');

    if (products.length === 0) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    products.forEach(function(p){
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="prod-name-cell">' +
          '<div class="prod-thumb"><img src="' + p.image + '" alt="' + p.name + '" onerror="this.style.display=\'none\'"></div>' +
          '<span class="prod-name">' + p.name + '</span>' +
        '</div></td>' +
        '<td><span class="prod-line-tag">' + p.line + '</span></td>' +
        '<td>$' + Number(p.price).toLocaleString('es-MX') + ' MXN</td>' +
        '<td><span class="status-tag ' + p.tag + '">' + tagLabel(p.tag) + '</span></td>' +
        '<td><div class="row-actions">' +
          '<button type="button" class="btn-edit" data-id="' + p.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
            'Editar' +
          '</button>' +
          '<button type="button" class="btn-delete" data-id="' + p.id + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
            'Eliminar' +
          '</button>' +
        '</div></td>';
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.btn-edit').forEach(function(btn){
      btn.addEventListener('click', function(){ abrirModalEditar(btn.dataset.id); });
    });
    tbody.querySelectorAll('.btn-delete').forEach(function(btn){
      btn.addEventListener('click', function(){ eliminarProducto(btn.dataset.id); });
    });
  }

  // ---------- Modal ----------
  const modalOverlay = document.getElementById('modalOverlay');
  const productForm = document.getElementById('productForm');

  function abrirModalAgregar(){
    document.getElementById('modalTitle').textContent = 'Agregar producto';
    productForm.reset();
    document.getElementById('f-id').value = '';
    modalOverlay.classList.add('show');
  }

  function abrirModalEditar(id){
    const products = getProducts();
    const product = products.find(function(p){ return p.id === id; });
    if (!product) return;

    document.getElementById('modalTitle').textContent = 'Editar producto';
    document.getElementById('f-id').value = product.id;
    document.getElementById('f-name').value = product.name;
    document.getElementById('f-line').value = product.line;
    document.getElementById('f-price').value = product.price;
    document.getElementById('f-image').value = product.image;
    document.getElementById('f-tag').value = product.tag;
    modalOverlay.classList.add('show');
  }

  function cerrarModal(){
    modalOverlay.classList.remove('show');
  }

  document.getElementById('btnAdd').addEventListener('click', abrirModalAgregar);
  document.getElementById('btnCancel').addEventListener('click', cerrarModal);
  modalOverlay.addEventListener('click', function(e){
    if (e.target === modalOverlay) cerrarModal();
  });

  productForm.addEventListener('submit', function(e){
    e.preventDefault();

    const id = document.getElementById('f-id').value;
    const name = document.getElementById('f-name').value.trim();
    const line = document.getElementById('f-line').value;
    const price = Number(document.getElementById('f-price').value);
    const image = document.getElementById('f-image').value.trim() || 'images/placeholder.png';
    const tag = document.getElementById('f-tag').value;

    let products = getProducts();

    if (id) {
      // Editar (simulado): actualiza el producto existente
      products = products.map(function(p){
        return p.id === id ? { id: id, name: name, line: line, price: price, image: image, tag: tag } : p;
      });
      showToast('Producto actualizado (simulado)');
    } else {
      // Agregar (simulado)
      const newId = line.toLowerCase().replace(/\s+/g, '') + '-' + Date.now();
      products.push({ id: newId, name: name, line: line, price: price, image: image, tag: tag });
      showToast('Producto agregado (simulado)');
    }

    saveProducts(products);
    cerrarModal();
    render();
  });

  function eliminarProducto(id){
    const products = getProducts();
    const product = products.find(function(p){ return p.id === id; });
    if (!product) return;

    const confirmado = confirm('¿Seguro que quieres eliminar "' + product.name + '"? Esta acción es simulada.');
    if (!confirmado) return;

    const updated = products.filter(function(p){ return p.id !== id; });
    saveProducts(updated);
    render();
    showToast('Producto eliminado (simulado)');
  }

  render();
</script>

</body>
</html>
